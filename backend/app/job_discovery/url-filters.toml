# Listing rejection criteria for Stage 3 discovery (single source of truth).
# Loaded via config.toml [job_discovery].url_filters_file (relative to this package).
# Applied by listing_gate.py: Exa search kwargs + post-SERP accept/filter.
#
# skip_domains: exact hostname match (after stripping www.).
# skip_domain_suffixes: hostname equals entry or ends with ".entry".
# include_domains: optional Exa allowlist; empty = no include filter.

