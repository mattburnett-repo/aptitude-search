# SERP junk filters for Stage 3 job discovery.
# Edit lists here; loaded via config.toml [job_discovery].url_filters_file (relative to this package).
#
# skip_domains: exact hostname match (after stripping www.), e.g. medium.com blocks www.medium.com only.
# skip_domain_suffixes: hostname equals entry or ends with ".entry" (optional; may be empty).
# include_domains: optional Tavily allowlist; empty = no include filter (search the open web).

skip_domains = [
  "baeldung.com",
  "create-react-app.dev",
  "dev.to",
  "developer.mozilla.org",
  "example.com",
  "example.net",
  "example.org",
  "fiverr.com",
  "freelancer.com",
  "freecodecamp.org",
  "geeksforgeeks.org",
  "hashnode.dev",
  "medium.com",
  "react.dev",
  "reddit.com",
  "stackoverflow.com",
  "substack.com",
  "toptal.com",
  "tutorialspoint.com",
  "typescriptlang.org",
  "upwork.com",
  "w3schools.com",
  "wikipedia.org",
  "youtube.com",
]

include_domains = []

skip_domain_suffixes = []

skip_path_markers = [
  "/docs/",
  "/documentation/",
  "/tutorial/",
  "/tutorials/",
  "/guide/",
  "/guides/",
  "/learn/",
  "/wiki/",
  "/blog/",
]

# Optional; empty = do not skip board list/search URLs (higher recall).
skip_listing_path_markers = []

skip_listing_path_markers_case_sensitive = []

skip_title_phrases = [
  "documentation",
  "tutorial",
  "how to ",
  "getting started",
  "what is ",
  "boilerplate",
  "dev community",
  "technical interview -",
  "interview questions",
  "complete guide",
  "ultimate guide",
  "roadmap",
  " vs ",
  "best practices",
  "top ",
  "salary guide",
  "career path",
]
