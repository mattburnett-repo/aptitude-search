# SERP and found_jobs URL filters for Stage 3 job discovery.
# Edit lists here; loaded via config.toml [job_discovery].url_filters_file (relative to this package).

skip_domains = [
  "baeldung.com",
  "create-react-app.dev",
  "dev.to",
  "developer.mozilla.org",
  "example.com",
  "example.net",
  "example.org",
  "fiverr.com",
  "freelancer.com",
  "freecodecamp.org",
  "geeksforgeeks.org",
  "hashnode.dev",
  "linkedin.com",
  "medium.com",
  "react.dev",
  "reddit.com",
  "stackoverflow.com",
  "substack.com",
  "toptal.com",
  "tutorialspoint.com",
  "typescriptlang.org",
  "upwork.com",
  "w3schools.com",
  "wikipedia.org",
  "youtube.com",
]

skip_path_markers = [
  "/docs/",
  "/documentation/",
  "/tutorial/",
  "/tutorials/",
  "/guide/",
  "/guides/",
  "/learn/",
  "/wiki/",
  "/blog/",
]

# Job-board search/list pages (not individual postings).
skip_listing_path_markers = [
  "/q-",
  "/jobs/search",
  "/job/search",
  "/browsejobs",
]

# Case-sensitive path fragments (e.g. ZipRecruiter /Jobs/ index).
skip_listing_path_markers_case_sensitive = [
  "/Jobs/",
]

skip_title_phrases = [
  "documentation",
  "tutorial",
  "how to ",
  "getting started",
  "what is ",
  "boilerplate",
  "dev community",
  "technical interview -",
  "interview questions",
  "complete guide",
  "ultimate guide",
  "roadmap",
  " vs ",
  "best practices",
  "top ",
  "salary guide",
  "career path",
]

job_url_markers = [
  "boards.greenhouse.io",
  "jobs.lever.co",
  "jobs.ashbyhq.com",
  "apply.workable.com",
  "myworkdayjobs.com",
  "icims.com",
  "smartrecruiters.com",
  "job-boards.",
  "javascript.jobs",
  "/jobs/",
  "/job/",
  "/careers/",
  "/career/",
  "/hiring/",
]
