[app]
title = "aptitude-search-api"
version = "0.0.0"
service = "aptitude-search-api"

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[llm.aptitude]
model_key = "test-key"
model = "test/aptitude-model"
temperature = 0.0
max_tokens = 8192

[llm.input_guard]
model_key = "test-key"
model = "test/input-guard-model"
chunk_max_chars = 1800
malicious_score_threshold = 0.5

[input_safety]
max_resume_chars = 100000
pii_entities = ["EMAIL_ADDRESS", "PHONE_NUMBER", "PERSON", "LOCATION", "US_SSN"]

[llm.job_discovery]
model_key = "test-key"
model = "test/job-discovery-synthesis-model"
temperature = 0.0
visit_max_output_length = 8000
search_max_results = 10
search_scrape_max = 3
search_snippet_max_chars = 300
search_rate_limit = 1.0
page_summary_max_chars = 1500
page_bullet_max_count = 8
page_snippet_max_chars = 400

[embedding]
model_key = "test-key"
model = "test/embedding-model"
dimensions = 1024

[onet]
host = "localhost"
port = 5432
database = "onet_test"
user = "test"
password = "test"
sslmode = "disable"

[onet_matching]
enabled = false
top_k = 8
min_similarity = 0.0

[job_discovery]
url_filters_file = "url-filters.toml"
discovery_query_max = 6
search_backends = ["bing", "brave", "duckduckgo", "google", "yahoo", "yandex", "wikipedia"]
aptitude_fit_min_score = 1
aptitude_fit_min_results = 2

[prompts]
stage1_file = "01-resume-to-aptitude-profile.md"
stage2_file = "02-role-family-plan.md"
stage3_synthesis_file = "03-job-discovery-synthesis.md"
stage1_user_task_file = "stage1-agent-user-task.txt"
stage2_user_task_file = "role-family-plan-user-task.txt"
stage3_synthesis_user_task_file = "stage3-synthesis-user-task.txt"

[schemas]
constraints = "constraints.schema.json"
aptitude_profile = "aptitude-profile.schema.json"
role_family_plan = "role-family-plan.schema.json"
job_discovery_results = "job-discovery-results.schema.json"
input_guard = "input-guard.schema.json"

[paths]
prompts_dir = "prompts"
schemas_dir = "schemas"
fixtures_example_outputs_dir = "fixtures/example-outputs"

[[fixtures.files]]
name = "career-changer-mixed-stack-stage1.json"
stage = "aptitudeProfile"

[[fixtures.files]]
name = "career-changer-role-family-plan.json"
stage = "roleFamilyPlan"

[[fixtures.files]]
name = "input-guard-clean-pass.json"
stage = "inputGuard"

[[fixtures.files]]
name = "input-guard-injection-detected.json"
stage = "inputGuard"
