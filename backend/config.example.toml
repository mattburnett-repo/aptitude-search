[app]
title = "aptitude-search-api"
version = "1.0.0"
service = "aptitude-search-api"

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[llm.aptitude]
model_key = ""  # required: Hugging Face key for Stage 1
model = ""  # Stage 1: resume → aptitude profile
temperature = 0.3  # modest variation in profile interpretation
max_tokens = 8192  # Stage 1 JSON output cap; raise if responses truncate

[llm.input_guard]
model_key = ""  # required: Hugging Face key for injection classifier
model = "meta-llama/Llama-Prompt-Guard-2-22M"
chunk_max_chars = 1800
malicious_score_threshold = 0.5  # block when malicious score >= this (0–1); higher = fewer blocks, lower = stricter

[input_safety]
max_resume_chars = 100000
pii_entities = ["EMAIL_ADDRESS", "PHONE_NUMBER", "PERSON", "LOCATION", "US_SSN"]

[llm.job_discovery]
model_key = ""  # required: Hugging Face key for Stage 3 synthesis
model = ""  # Stage 3: found_jobs → verified_matches JSON (match explanations)
temperature = 0.0  # synthesis JSON temperature
max_tokens = 8192  # Stage 3 synthesis JSON output cap; raise if responses truncate
search_max_results = 10  # Tavily search results per query
search_snippet_max_chars = 300  # max chars per Tavily result snippet on found_jobs
search_rate_limit = 1.0  # min seconds between searches; omit or set null to disable

[embedding]
model_key = ""  # required: Hugging Face key for occupation + aptitude vectors
model = ""  # e.g. BAAI/bge-large-en-v1.5
dimensions = 1024
provider = "hf-inference"  # required: must support feature-extraction for the model

[onet]
host = ""       # e.g. dpg-xxxxx.oregon-postgres.render.com
port = 5432
database = ""   # Postgres database with O*NET + occupation_embeddings
user = ""
password = ""
sslmode = "require"

[onet_matching]
enabled = true    # required; set false to skip O*NET vector search before Stage 2
top_k = 8         # required
min_similarity = 0.0  # required

[job_discovery]
url_filters_file = "url-filters.toml"  # SERP/found_jobs skip lists (app/job_discovery/)
discovery_query_max = 6  # max search_job_postings calls per pipeline run
tavily_api_key = ""  # required: Tavily API key for Stage 3 search
result_top_k = 25  # max ranked jobs passed to synthesis after aptitude fit
search_depth = "basic"  # Tavily: basic | advanced | fast | ultra-fast
search_min_score = 0.0  # drop Tavily hits below this score (0–1); 0 keeps all

[prompts]
stage1_file = "01-resume-to-aptitude-profile.md"
stage2_file = "02-role-family-plan.md"
stage3_synthesis_file = "03-job-discovery-synthesis.md"
stage1_user_task_file = "stage1-agent-user-task.txt"
stage2_user_task_file = "role-family-plan-user-task.txt"
stage3_synthesis_user_task_file = "stage3-synthesis-user-task.txt"

[schemas]
constraints = "constraints.schema.json"
aptitude_profile = "aptitude-profile.schema.json"
role_family_plan = "role-family-plan.schema.json"
job_discovery_results = "job-discovery-results.schema.json"
input_guard = "input-guard.schema.json"

[paths]
prompts_dir = "prompts"
schemas_dir = "schemas"
fixtures_example_outputs_dir = "fixtures/example-outputs"

[[fixtures.files]]
name = "career-changer-mixed-stack-stage1.json"
stage = "aptitudeProfile"

[[fixtures.files]]
name = "career-changer-role-family-plan.json"
stage = "roleFamilyPlan"

[[fixtures.files]]
name = "input-guard-clean-pass.json"
stage = "inputGuard"

[[fixtures.files]]
name = "input-guard-injection-detected.json"
stage = "inputGuard"
