[app]
title = "aptitude-search-api"
version = "1.0.0"
service = "aptitude-search-api"

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[llm]
aptitude_model_key = ""  # required: Hugging Face key for Stage 1
aptitude_model = ""  # Stage 1: resume → aptitude profile
job_discovery_model_key = ""  # required: Hugging Face key for Stage 2 agent (may match aptitude_model_key)
job_discovery_model = "meta-llama/Llama-3.1-8B-Instruct"  # Stage 2 agent; must be enabled on your HF account
job_discovery_max_steps = 14
temperature = 0.3

[prompts]
stage1_file = "01-resume-to-aptitude-profile.md"
stage2_file = "02-verified-job-discovery.md"
stage1_user_task_file = "stage1-agent-user-task.txt"
stage2_user_task_file = "stage2-agent-user-task.txt"

[schemas]
constraints = "constraints.schema.json"
aptitude_profile = "aptitude-profile.schema.json"
job_discovery_results = "job-discovery-results.schema.json"

[paths]
prompts_dir = "prompts"
schemas_dir = "schemas"
fixtures_example_outputs_dir = "fixtures/example-outputs"

[[fixtures.files]]
name = "career-changer-mixed-stack-stage1.json"
stage = "aptitudeProfile"
