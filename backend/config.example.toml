[app]
title = "aptitude-search-api"
version = "1.0.0"
service = "aptitude-search-api"

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[llm.aptitude]
model_key = ""  # required: Hugging Face key for Stage 1
model = ""  # Stage 1: resume → aptitude profile
temperature = 0.3  # modest variation in profile interpretation
max_tokens = 8192  # Stage 1 JSON output cap; raise if responses truncate

[llm.job_discovery]
temperature = 0.0  # synthesis JSON temperature ([llm.aptitude] provides model + key)
visit_max_output_length = 8000  # max chars fetched per page scrape
search_max_results = 10  # DuckDuckGo results per search query
search_scrape_max = 3  # max posting URLs scraped per search_job_postings call
search_snippet_max_chars = 300  # max chars per DuckDuckGo result body in tool output
search_rate_limit = 1.0  # min seconds between searches; omit or set null to disable
page_summary_max_chars = 1500  # max chars returned per visited page
page_bullet_max_count = 8  # max bullet points extracted per visited page
page_snippet_max_chars = 400  # max chars in body snippet per visited page

[job_discovery]
url_filters_file = "url-filters.toml"  # SERP/found_jobs skip lists (app/job_discovery/)
discovery_query_max = 6  # max search_job_postings calls per pipeline run
aptitude_fit_min_score = 1  # min work-pattern fit score to keep a found job
aptitude_fit_min_results = 2  # keep at least this many jobs when none meet min_score

[prompts]
stage1_file = "01-resume-to-aptitude-profile.md"
stage1_5_file = "02-role-family-plan.md"
stage2_synthesis_file = "03-job-discovery-synthesis.md"
stage1_user_task_file = "stage1-agent-user-task.txt"
stage1_5_user_task_file = "role-family-plan-user-task.txt"
stage2_synthesis_user_task_file = "stage2-synthesis-user-task.txt"

[schemas]
constraints = "constraints.schema.json"
aptitude_profile = "aptitude-profile.schema.json"
role_family_plan = "role-family-plan.schema.json"
job_discovery_results = "job-discovery-results.schema.json"

[paths]
prompts_dir = "prompts"
schemas_dir = "schemas"
fixtures_example_outputs_dir = "fixtures/example-outputs"

[[fixtures.files]]
name = "career-changer-mixed-stack-stage1.json"
stage = "aptitudeProfile"

[[fixtures.files]]
name = "career-changer-role-family-plan.json"
stage = "roleFamilyPlan"
